{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}VitaSansano{% endblock %}</title>
  
  <!-- Fuente Figtree -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #F3F7F3;
      --surface: #fff;
      --ink: #1D2B24;
      --mute: #5F7168;
      --accent: #2F7D55;
      --ac: #fff;
      --soft: #DDEEE3;
      --line: #D5E3DA;
      --error: #D9534F;
      --head: 'Figtree', system-ui, sans-serif;
      --rc: 16px;
      --ri: 10px;
      --rb: 999px;
    }
    
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--head);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    a { text-decoration: none; color: inherit; }
    button, select, input { font: inherit; color: inherit; }

    /* BARRA SUPERIOR (Alineada de borde a borde) */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 16px 40px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .brand {
      font: 700 20px var(--head);
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
    }

    .brand i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    .nav nav {
      display: flex;
      gap: 8px;
    }

    .nav nav a {
      color: var(--mute);
      padding: 8px 16px;
      border-radius: var(--rb);
      font-weight: 500;
      transition: 0.2s;
    }

    .nav nav a:hover, .nav nav a.on {
      background: var(--soft);
      color: var(--ink);
      font-weight: 600;
    }

    /* CONTENEDOR PRINCIPAL (Centra las tarjetas) */
    main {
      width: 100%;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      display: flex;
      justify-content: center;
      flex: 1;
    }

    .btn {
      background: var(--accent);
      color: var(--ac);
      border: 0;
      border-radius: var(--rb);
      padding: 13px 26px;
      font-weight: 600;
      cursor: pointer;
      display: inline-block;
      text-align: center;
      transition: 0.2s;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--rc);
      padding: 24px;
      width: 100%;
    }
  </style>
  
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Cabecera global -->
  <header class="nav">
    <a href="{% url 'inicio' %}" class="brand"><i></i>VitaSansano</a>
    <nav>
      <a href="{% url 'inicio' %}" class="{% if request.resolver_match.url_name == 'inicio' %}on{% endif %}">Inicio</a>
      <a href="{% url 'encuesta_datos' %}" class="{% if request.resolver_match.url_name == 'encuesta_datos' %}on{% endif %}">Mis datos</a>
      <a href="#" class="{% if request.resolver_match.url_name == 'horarios' %}on{% endif %}">Mi plan</a>
      <a href="{% url 'portal' %}" class="{% if request.resolver_match.url_name == 'portal' %}on{% endif %}">Portal</a>
      <a href="{% url 'login' %}" class="{% if request.resolver_match.url_name == 'login' %}on{% endif %}">Entrar</a>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main>
    {% block content %}
    {% endblock %}
  </main>

  {% block extra_js %}{% endblock %}
</body>
</html>
