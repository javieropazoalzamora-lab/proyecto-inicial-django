<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}VitaSansano{% endblock %}</title>
</head>
{# Los clientes de correo ignoran <style> y variables CSS: todo va en estilos en línea, #}
{# con los mismos colores del tema "verde" de base.html. #}
<body style="margin:0;padding:0;background:#F3F7F3;font-family:'Figtree',Segoe UI,Helvetica,Arial,sans-serif;color:#1D2B24;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F3F7F3;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
          <tr>
            <td style="padding:0 4px 18px;font-size:20px;font-weight:700;color:#1D2B24;">
              <span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#2F7D55;margin-right:8px;"></span>VitaSansano
            </td>
          </tr>
          <tr>
            <td style="background:#ffffff;border:1px solid #D5E3DA;border-radius:16px;padding:32px 28px;">
              {% block contenido %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 4px 0;font-size:12px;line-height:1.5;color:#5F7168;">
              Recibiste este correo porque alguien usó esta dirección en VitaSansano.
              Si no fuiste tú, puedes ignorarlo con tranquilidad.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
